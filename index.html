<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一年後の自分へ</title>
  
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  <meta name="apple-mobile-web-app-title" content="一年後の自分へ">
  <meta name="application-name" content="一年後の自分へ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root {
      --primary: #d97706;
      --primary-light: #fef3c7;
      --bg: #fffbf5;
      --card-bg: #ffffff;
      --text: #1e293b;
      --sub-text: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 90px;
    }
    header {
      background: #ffffff;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-title h1 {
      font-size: 1.1rem;
      color: #92400e;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-title p { font-size: 0.75rem; color: var(--sub-text); margin-top: 2px; }
    .notification-btn {
      background: var(--primary-light);
      color: #b45309;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }
    main { max-width: 500px; margin: 0 auto; padding: 16px; }
    .section-title {
      font-size: 1rem;
      font-weight: bold;
      color: #92400e;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      margin-bottom: 20px;
      border: 1px solid #fef3c7;
    }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    textarea, input[type="text"], input[type="search"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      background-color: #fafaf9;
    }
    textarea { resize: vertical; min-height: 90px; }
    textarea:focus, input[type="text"]:focus, input[type="search"]:focus {
      outline: none; border-color: var(--primary); background-color: #ffffff;
    }
    .search-box { margin-bottom: 12px; }
    .photo-upload-box {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background: #fafaf9;
      cursor: pointer;
      color: var(--sub-text);
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .photo-upload-box input { display: none; }
    .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    .option-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 0.85rem;
      text-align: center;
      cursor: pointer;
    }
    .option-btn.selected { background: var(--primary-light); border-color: var(--primary); color: #92400e; font-weight: bold; }
    .date-input-container { margin-top: 8px; display: none; }
    .date-input-container.active { display: block; }
    input[type="date"] {
      width: 100%; padding: 10px; border: 1px solid var(--primary); border-radius: 10px; font-size: 1rem; background-color: #fff;
    }
    .date-display {
      background: #fafaf9; border: 1px solid var(--border); padding: 10px; border-radius: 10px; text-align: center; font-size: 0.95rem; color: var(--sub-text); margin-top: 8px;
    }
    
    .tags-container { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag-chip {
      background: #ffffff; border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .tag-chip.selected { background: var(--primary-light); border-color: var(--primary); color: #92400e; font-weight: bold; }
    .tag-delete-x { font-size: 0.75rem; color: var(--danger); cursor: pointer; padding: 0 2px; }
    .tag-add-btn {
      background: #f1f5f9; border: 1px dashed var(--sub-text); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; color: var(--sub-text);
    }
    .custom-tag-row { display: flex; gap: 8px; margin-top: 8px; display: none; }
    .custom-tag-row.active { display: flex; }

    .btn-submit {
      width: 100%; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2); margin-top: 10px;
    }

    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
    .calendar-nav-group { display: flex; gap: 4px; align-items: center; }
    .calendar-header button { background: none; border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .calendar-day-head { font-weight: bold; font-size: 0.8rem; padding: 6px 0; color: var(--sub-text); }
    .calendar-day {
      background: white; border: 1px solid var(--border); border-radius: 8px; min-height: 48px; padding: 4px 2px; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative;
    }
    .calendar-day.other-month { opacity: 0.3; }
    .calendar-day .day-num { font-weight: bold; }
    .calendar-day .event-badge { font-size: 0.65rem; line-height: 1; margin-top: 2px; }

    /* トースト通知 */
    #toastMessage {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(-150px);
      background: var(--success);
      color: white;
      padding: 14px 30px;
      border-radius: 30px;
      font-weight: bold;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 999999;
      font-size: 1.05rem;
    }
    #toastMessage.show {
      transform: translateX(-50%) translateY(0);
    }

    nav.bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; height: 70px; z-index: 100;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: var(--sub-text); background: none; border: none; flex: 1; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .nav-center-btn {
      width: 50px; height: 50px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3); position: relative; top: -10px; border: none; cursor: pointer;
    }
    .timeline { display: flex; flex-direction: column; gap: 16px; }
    .item-card { background: white; border-radius: 14px; border: 1px solid var(--border); padding: 16px; }
    .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .item-badge { background: var(--primary-light); color: #92400e; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    .item-header-right { display: flex; align-items: center; gap: 8px; }
    .item-date { font-size: 0.75rem; color: var(--sub-text); }
    .delete-btn { background: none; border: none; color: var(--danger); font-size: 0.75rem; cursor: pointer; }
    .item-text { font-size: 0.95rem; white-space: pre-wrap; margin-top: 6px; }
    .item-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="toastMessage">✨ 保存しました！</div>

  <header>
    <div class="header-title">
      <h1>⏳ 一年後の自分へ</h1>
      <p>未来へ届くタイムカプセル日記</p>
    </div>
    <button class="notification-btn" onclick="alert('通知テストを送信しました！')">🔔 通知テスト</button>
  </header>

  <main>
    <div id="create-view">
      <div class="section-title">✍️ 未来へのメッセージを作成</div>
      <div class="card">
        <div class="form-group">
          <label>メモ内容</label>
          <textarea id="memoText" placeholder="例：冬物の服はほぼ捨てました。来年買ってください。またはサービス解約のリマインドなど"></textarea>
        </div>

        <div class="form-group">
          <label>写真を添える（任意）</label>
          <label class="photo-upload-box">
            <span id="uploadLabelText">📷 写真を選択または撮影</span>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(this)">
          </label>
          <div id="file-name" style="font-size: 0.8rem; color: var(--primary); margin-top: 4px; text-align: center;"></div>
        </div>

        <div class="form-group">
          <label>いつ届ける？（タイミング）</label>
          <div class="options-grid">
            <button type="button" class="option-btn" onclick="setPeriod('1ヶ月後', this)">1ヶ月後</button>
            <button type="button" class="option-btn" onclick="setPeriod('3ヶ月後', this)">3ヶ月後</button>
            <button type="button" class="option-btn" onclick="setPeriod('半年後', this)">半年後</button>
            <button type="button" class="option-btn selected" onclick="setPeriod('1年後', this)">1年後</button>
            <button type="button" class="option-btn" onclick="setPeriod('日付指定', this)" style="grid-column: span 2;">日付を直接指定</button>
          </div>
          
          <div class="date-display" id="targetDateDisplay"></div>
          <div class="date-input-container" id="dateInputContainer">
            <input type="date" id="customDatepicker" onchange="updateCustomDate(this)">
          </div>
        </div>

        <div class="form-group">
          <label>誰に贈る？（宛先タグ）</label>
          <div class="tags-container" id="tagsContainer"></div>
          
          <div class="custom-tag-row" id="customTagRow">
            <input type="text" id="customTagInput" placeholder="新しいタグ名を入力">
            <button type="button" class="option-btn" onclick="addNewTag()" style="background:var(--primary); color:white; border:none; padding:0 16px;">追加</button>
          </div>
        </div>

        <button class="btn-submit" onclick="saveItem()">タイムカプセルに保存する</button>
      </div>
    </div>

    <div id="list-view" style="display: none;">
      <div class="section-title">📦 タイムライン</div>
      <div class="search-box">
        <input type="search" id="timelineSearch" placeholder="🔍 メッセージや宛先を検索..." oninput="renderTimeline()">
      </div>
      <div class="timeline" id="timeline"></div>
    </div>

    <div id="calendar-view" style="display: none;">
      <div class="section-title">📅 カレンダー</div>
      
      <div class="search-box" id="calendarSearchBox">
        <input type="search" id="calendarSearch" placeholder="🔍 メッセージ検索..." oninput="renderCalendarTimeline()">
      </div>

      <div class="card">
        <div class="calendar-header">
          <div class="calendar-nav-group">
            <button onclick="changeMonth(-1)">◀ 前月</button>
            <input type="month" id="calendarMonthPicker" onchange="jumpToMonth(this)" style="padding:4px; border:1px solid var(--border); border-radius:6px; font-size:0.8rem; background:#fafaf9;">
            <button onclick="changeMonth(1)">次月 ▶</button>
          </div>
          <strong id="calendarMonthTitle" style="font-size: 0.95rem;">2026年11月</strong>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      <div class="section-title" id="selectedDateTitle">選んだ日のメッセージ</div>
      <div class="timeline" id="calendarTimeline"></div>
    </div>

    <div id="photos-view" style="display: none;">
      <div class="section-title">📸 写真集</div>
      <div class="timeline" id="photoTimeline"></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('timeline', this)">
      <span>⏱️</span>
      <span>タイムライン</span>
    </button>
    <button class="nav-item" onclick="switchTab('calendar', this)">
      <span>📅</span>
      <span>カレンダー</span>
    </button>
    <button class="nav-center-btn" onclick="switchTab('create', this)">+</button>
    <button class="nav-item" onclick="switchTab('photos', this)">
      <span>🖼️</span>
      <span>写真集</span>
    </button>
  </nav>

  <script>
    let selectedPeriod = '1年後';
    let targetDeliveryDateStr = '';
    let base64Image = null;
    let items = JSON.parse(localStorage.getItem('timeCapsuleItems') || '[]');
    let currentCalendarDate = new Date();
    let selectedCalendarDayStr = '';

    let tagsList = JSON.parse(localStorage.getItem('timeCapsuleTags') || JSON.stringify(['1年後の自分', '冬の自分', '次の来客前', '契約更新時']));
    let selectedTag = tagsList[0] || '1年後の自分';

    const targetDateDisplay = document.getElementById('targetDateDisplay');
    const dateInputContainer = document.getElementById('dateInputContainer');
    const customDatepicker = document.getElementById('customDatepicker');
    const customTagRow = document.getElementById('customTagRow');
    const customTagInput = document.getElementById('customTagInput');

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}/${m}/${day}`;
    }

    let defaultDate = new Date();
    defaultDate.setFullYear(defaultDate.getFullYear() + 1);
    targetDeliveryDateStr = formatDate(defaultDate);
    targetDateDisplay.innerText = targetDeliveryDateStr;

    function renderTags() {
      const container = document.getElementById('tagsContainer');
      container.innerHTML = '';

      tagsList.forEach(tag => {
        const chip = document.createElement('div');
        chip.className = `tag-chip ${selectedTag === tag ? 'selected' : ''}`;
        
        let html = `<span onclick="selectTag('${tag}')">${tag}</span>`;
        if (tagsList.length > 1) {
          html += `<span class="tag-delete-x" onclick="removeTag(event, '${tag}')">×</span>`;
        }
        chip.innerHTML = html;
        container.appendChild(chip);
      });

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'tag-add-btn';
      addBtn.innerText = '＋ 追加';
      addBtn.onclick = toggleCustomTagRow;
      container.appendChild(addBtn);
    }

    function selectTag(tag) {
      selectedTag = tag;
      renderTags();
    }

    function toggleCustomTagRow() {
      customTagRow.classList.toggle('active');
      if (customTagRow.classList.contains('active')) {
        customTagInput.focus();
      }
    }

    function addNewTag() {
      const newTag = customTagInput.value.trim();
      if (!newTag) return;
      if (tagsList.includes(newTag)) {
        alert('すでに存在するタグです');
        return;
      }
      tagsList.push(newTag);
      localStorage.setItem('timeCapsuleTags', JSON.stringify(tagsList));
      selectedTag = newTag;
      customTagInput.value = '';
      customTagRow.classList.remove('active');
      renderTags();
    }

    function removeTag(event, tag) {
      event.stopPropagation();
      if (tagsList.length <= 1) {
        alert('最後のタグは削除できません');
        return;
      }
      if (confirm(`タグ「${tag}」を削除しますか？`)) {
        tagsList = tagsList.filter(t => t !== tag);
        localStorage.setItem('timeCapsuleTags', JSON.stringify(tagsList));
        if (selectedTag === tag) {
          selectedTag = tagsList[0];
        }
        renderTags();
      }
    }

    function setPeriod(period, el) {
      document.querySelectorAll('.options-grid .option-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      selectedPeriod = period;

      if (period === '日付指定') {
        targetDateDisplay.style.display = 'none';
        dateInputContainer.classList.add('active');
        if (!customDatepicker.value) customDatepicker.valueAsDate = defaultDate;
        updateCustomDate(customDatepicker);
      } else {
        dateInputContainer.classList.remove('active');
        targetDateDisplay.style.display = 'block';
        
        let d = new Date();
        if (period === '1ヶ月後') d.setMonth(d.getMonth() + 1);
        else if (period === '3ヶ月後') d.setMonth(d.getMonth() + 3);
        else if (period === '半年後') d.setMonth(d.getMonth() + 6);
        else if (period === '1年後') d.setFullYear(d.getFullYear() + 1);
        
        targetDeliveryDateStr = formatDate(d);
        targetDateDisplay.innerText = targetDeliveryDateStr;
      }
    }

    function updateCustomDate(input) {
      if (input.value) {
        const d = new Date(input.value);
        targetDeliveryDateStr = formatDate(d);
        targetDateDisplay.innerText = targetDeliveryDateStr;
      }
    }

    function previewImage(input) {
      if (input.files && input.files[0]) {
        document.getElementById('file-name').innerText = '選択中: ' + input.files[0].name;
        const reader = new FileReader();
        reader.onload = function(e) { base64Image = e.target.result; };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function saveItem() {
      const text = document.getElementById('memoText').value;
      if (!text && !base64Image) {
        alert('メモか写真を入力してください');
        return;
      }

      const todayStr = formatDate(new Date());

      const newItem = {
        id: Date.now(),
        text,
        period: selectedPeriod,
        tag: selectedTag,
        createdDate: todayStr,
        targetDate: targetDeliveryDateStr,
        img: base64Image
      };

      items.unshift(newItem);
      localStorage.setItem('timeCapsuleItems', JSON.stringify(items));
      
      // 入力内容とファイルの完全クリア
      document.getElementById('memoText').value = '';
      base64Image = null;
      document.getElementById('imageInput').value = '';
      document.getElementById('file-name').innerText = '';
      customTagInput.value = '';
      customTagRow.classList.remove('active');

      // トースト通知を表示
      showToast();

      // タイムラインへ移動
      switchTab('timeline', document.querySelectorAll('.nav-item')[0]);
    }

    function showToast() {
      const toast = document.getElementById('toastMessage');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function deleteItem(id) {
      if (confirm('このメッセージを削除しますか？')) {
        items = items.filter(item => item.id !== id);
        localStorage.setItem('timeCapsuleItems', JSON.stringify(items));
        renderTimeline();
        renderCalendar();
        renderPhotos();
      }
    }

    function switchTab(tabName, el) {
      document.getElementById('create-view').style.display = 'none';
      document.getElementById('list-view').style.display = 'none';
      document.getElementById('calendar-view').style.display = 'none';
      document.getElementById('photos-view').style.display = 'none';
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      if (tabName === 'create') {
        document.getElementById('create-view').style.display = 'block';
        if(el) el.classList.add('active');
      } else if (tabName === 'timeline') {
        document.getElementById('list-view').style.display = 'block';
        if(el) el.classList.add('active');
        renderTimeline();
      } else if (tabName === 'calendar') {
        document.getElementById('calendar-view').style.display = 'block';
        if(el) el.classList.add('active');
        document.getElementById('calendarSearchBox').style.display = 'block';
        document.getElementById('calendarSearch').value = '';
        renderCalendar();
      } else if (tabName === 'photos') {
        document.getElementById('photos-view').style.display = 'block';
        if(el) el.classList.add('active');
        renderPhotos();
      }
    }

    function renderTimeline() {
      const container = document.getElementById('timeline');
      const keyword = document.getElementById('timelineSearch').value.toLowerCase();
      container.innerHTML = '';

      const filtered = items.filter(i => 
        (i.text && i.text.toLowerCase().includes(keyword)) ||
        (i.tag && i.tag.toLowerCase().includes(keyword))
      );

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding: 20px;">条件に合うメモがありません。</p>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-header">
            <span class="item-badge">${item.tag}</span>
            <div class="item-header-right">
              <span class="item-date">📝 ${item.createdDate} ➔ 🎁 ${item.targetDate}</span>
              <button class="delete-btn" onclick="deleteItem(${item.id})">🗑️</button>
            </div>
          </div>
          <div class="item-text">${item.text}</div>
          ${item.img ? `<img src="${item.img}" class="item-img">` : ''}
        `;
        container.appendChild(card);
      });
    }

    function changeMonth(diff) {
      currentCalendarDate.setMonth(currentCalendarDate.getMonth() + diff);
      renderCalendar();
    }

    function jumpToMonth(input) {
      if (input.value) {
        const [y, m] = input.value.split('-');
        currentCalendarDate.setFullYear(parseInt(y));
        currentCalendarDate.setMonth(parseInt(m) - 1);
        renderCalendar();
      }
    }

    function renderCalendar() {
      const year = currentCalendarDate.getFullYear();
      const month = currentCalendarDate.getMonth();
      document.getElementById('calendarMonthTitle').innerText = `${year}年 ${month + 1}月`;
      
      const mStr = String(month + 1).padStart(2, '0');
      document.getElementById('calendarMonthPicker').value = `${year}-${mStr}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
      weekDays.forEach(w => {
        const h = document.createElement('div');
        h.className = 'calendar-day-head';
        h.innerText = w;
        grid.appendChild(h);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      for (let i = firstDay - 1; i >= 0; i--) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day other-month';
        cell.innerHTML = `<span class="day-num">${prevLastDate - i}</span>`;
        grid.appendChild(cell);
      }

      for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}/${String(month + 1).padStart(2, '0')}/${String(day).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = 'calendar-day';

        const hasCreated = items.some(i => i.createdDate === dateStr);
        const hasTarget = items.some(i => i.targetDate === dateStr);

        let badges = '';
        if (hasCreated) badges += '<span class="event-badge">📝作成</span>';
        if (hasTarget) badges += '<span class="event-badge">🎁お届け</span>';

        cell.innerHTML = `<span class="day-num">${day}</span>${badges}`;
        cell.onclick = () => selectCalendarDay(dateStr);
        grid.appendChild(cell);
      }

      renderCalendarTimeline();
    }

    function selectCalendarDay(dateStr) {
      selectedCalendarDayStr = dateStr;
      document.getElementById('calendarSearch').value = '';
      document.getElementById('calendarSearchBox').style.display = 'none';

      document.getElementById('selectedDateTitle').innerText = `${dateStr} のメッセージ`;
      renderCalendarTimeline();
    }

    function renderCalendarTimeline() {
      const container = document.getElementById('calendarTimeline');
      const keyword = document.getElementById('calendarSearch').value.toLowerCase();
      container.innerHTML = '';

      let filtered = items;

      if (keyword) {
        filtered = filtered.filter(i => 
          (i.text && i.text.toLowerCase().includes(keyword)) ||
          (i.tag && i.tag.toLowerCase().includes(keyword))
        );
      } else if (selectedCalendarDayStr) {
        filtered = filtered.filter(i => i.createdDate === selectedCalendarDayStr || i.targetDate === selectedCalendarDayStr);
      } else {
        filtered = [];
      }

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding: 20px;">メッセージはありません。（カレンダーの日付をタップしてください）</p>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-header">
            <span class="item-badge">${item.tag}</span>
            <div class="item-header-right">
              <span class="item-date">📝 ${item.createdDate} ➔ 🎁 ${item.targetDate}</span>
              <button class="delete-btn" onclick="deleteItem(${item.id})">🗑️</button>
            </div>
          </div>
          <div class="item-text">${item.text}</div>
          ${item.img ? `<img src="${item.img}" class="item-img">` : ''}
        `;
        container.appendChild(card);
      });
    }

    function renderPhotos() {
      const container = document.getElementById('photoTimeline');
      container.innerHTML = '';
      const photoItems = items.filter(i => i.img);
      if (photoItems.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding: 20px;">写真付きのメモがまだありません。</p>';
        return;
      }
      photoItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-header">
            <span class="item-badge">${item.tag}</span>
            <div class="item-header-right">
              <span class="item-date">📝 ${item.createdDate}</span>
              <button class="delete-btn" onclick="deleteItem(${item.id})">🗑️</button>
            </div>
          </div>
          <img src="${item.img}" class="item-img">
          <div class="item-text" style="margin-top:8px;">${item.text}</div>
        `;
        container.appendChild(card);
      });
    }

    renderTags();
  </script>
</body>
</html>
